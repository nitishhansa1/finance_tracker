<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">Finance Tracker</h1>
        </header>

        <nav class="navbar">
            <ul class="navbar__menu">
                <li class="navbar__item"><a href="#" class="navbar__link">Balance</a></li>
                <li class="navbar__item"><a href="#" class="navbar__link">Form</a></li>
                <li class="navbar__item"><a href="login.html" class="navbar__link">Login</a></li>
            </ul>
        </nav>

        <main class="main">
            <section class="transactions">
                <h2 class="transactions__title">Transaction Balance</h2>
                <table class="table">
                    <thead class="table__head">
                        <tr class="table__row">
                            <th class="table__header">Sno.</th>
                            <th class="table__header">Description</th>
                            <th class="table__header">Amount</th>
                        </tr>
                    </thead>
                    <tbody class="table__body">
                        <tr class="table__row">
                            <td class="table__cell">1.</td>
                            <td class="table__cell">Groceries</td>
                            <td class="table__cell amount">$39,990</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>






    

</body>
</html>
