<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Tracker</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <section class="login">
        <form action="" class="form">
            <div class="name">
                <label for="name">Name</label>
                <input class="inpname" type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            <div class="email">
                <label for="email">Email</label>
                <input class="inpemail" type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <div class="pass">
                <label for="password">Password</label>
                <input class="inppass" type="password" id="password" name="password" required>
            </div>
            <div class="cpass">
                <label for="cpass">Confirm Password</label>
                <input class="inpcpass" type="password" id="cpass" name="cpass" required>
            </div>
            <button class="button" type="submit">Register</button>

        </form>
    </section>
</body>
</html>
